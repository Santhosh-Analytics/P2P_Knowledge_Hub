
app_name = "P2P Knowledge Hub"

[logs]
log_file_fmt = "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d | %(message)s"
log_to_file = true
log_level = "debug"
log_to_console = true
capturewarnings = true
rich_tracebacks = false

[exceptions]
default_error_message = "An unexpected error occured."

[chunking]
chunk_strategy = "sliding_word"
max_chunk_size = 70
chunk_overlap = 7


[embeddings]
provider = "sentence_transformers"
model = "sentence-transformers/all-MiniLM-L6-v2"
